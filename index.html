<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2332">
<title>ห้องเรียนชีววิทยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef5f4; --card:#ffffff; --ink:#1a2332; --muted:#647080; --line:#dae6e6;
    --green:#1f6f70; --green-2:#2d8b8b;
    --g-soft:#e2f1f0; --g-ink:#1f6f70;
    --b-soft:#e5eef7; --b-ink:#2c5d8f;
    --s-soft:#eef0f2; --s-ink:#8a949b;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{position:relative;overflow:hidden;color:#fff;padding:56px 0 92px}
  header .wrap{position:relative;z-index:1}
  .mark{width:44px;height:44px;border-radius:12px;border:1px solid rgba(168,218,220,.45);display:grid;place-items:center;color:var(--seafoam,#a8dadc);margin-bottom:22px}
  .mark svg{width:22px;height:22px}
  header h1{font-size:34px;font-weight:700;line-height:1.15}
  header p{margin-top:8px;font-size:16px;color:#a8dadc;font-weight:400}

  /* ---------- menu: แผ่นเดียว แบ่งแถวด้วยเส้น ---------- */
  main.wrap{margin-top:-56px;padding-bottom:40px;position:relative;z-index:2}
  .menu{background:var(--card);border-radius:20px;box-shadow:0 18px 40px -24px rgba(26,35,50,.45),0 1px 0 rgba(26,35,50,.04);overflow:hidden}
  .item{display:flex;align-items:center;gap:16px;padding:20px 22px;text-decoration:none;color:inherit;transition:background .15s}
  .item + .item{border-top:1px solid var(--line)}
  a.item:hover{background:#f4faf9}
  a.item:active{background:#e8f3f2}
  a.item:focus-visible{outline:2px solid var(--green-2);outline-offset:-4px;border-radius:16px}
  .icon{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
  .icon svg{width:24px;height:24px}
  .text{min-width:0;flex:1}
  .text h2{font-size:18px;font-weight:600;line-height:1.35}
  .text p{font-size:14px;color:var(--muted);margin-top:2px}
  .nw{white-space:nowrap}
  .go{flex:none;width:24px;height:24px;display:grid;place-items:center;color:#9aa8b2;transition:transform .15s,color .15s}
  .go svg{width:20px;height:20px}
  a.item:hover .go{transform:translateX(3px);color:var(--green)}

  .green .icon{background:var(--g-soft);color:var(--g-ink)}
  .blue  .icon{background:var(--b-soft);color:var(--b-ink)}
  .item.soon .icon{background:var(--s-soft);color:var(--s-ink)}
  .item.soon h2{color:var(--s-ink)}
  .item.soon p{color:#a5aeb3}
  .tag{flex:none;font-size:12px;font-weight:500;color:var(--s-ink);background:var(--s-soft);padding:4px 12px;border-radius:999px}

  footer{text-align:center;color:#8795a0;font-size:13px;padding:4px 0 36px}

  @media (max-width:420px){
    header{padding:40px 0 84px}
    header h1{font-size:28px}
    .mark{margin-bottom:18px}
    .item{gap:14px;padding:18px 16px}
    .icon{width:44px;height:44px;border-radius:12px}
    .text h2{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>
    </div>
    <h1>ห้องเรียนชีววิทยา</h1>
    <p>ม.4 ภาคเรียนที่ 2/2569 · โรงเรียนนางรอง</p>
  </div>
</header>

<main class="wrap">
  <nav id="menu" class="menu" aria-label="เมนูหลัก"></nav>
</main>


<script>
/* ===== เมนู: เพิ่ม/แก้ไขที่นี่ =====
   color: 'green' | 'blue'    ready: false = แสดง "เร็ว ๆ นี้"
   href ที่ขึ้นต้นด้วย https:// (เช่นลิงก์ Drive) จะเปิดในแท็บใหม่      */
const MENU = [
  { icon: 'book',   color: 'green', title: 'เอกสารประกอบการเรียน', desc: 'ใบความรู้ สไลด์ และคลิปประกอบบทเรียน',
    href: 'https://drive.google.com/drive/folders/1R1bPkcombRQYffNQXrdRec1xtFyFqQGI?usp=drive_link', ready: true },
  { icon: 'upload', color: 'blue',  title: 'ระบบส่งงาน', desc: 'ส่งงาน ตอบคำถามท้ายคาบ ดูคะแนน', href: 'submit/', ready: true },
  { icon: 'help',   color: 'green', title: 'คู่มือการใช้งาน', desc: 'วิธีลงทะเบียนและส่งงาน ทีละขั้นตอน', href: 'guide/', ready: true },
  { icon: 'exam',   color: 'green', title: 'ระบบสอบ',   desc: 'ทำแบบทดสอบออนไลน์ รู้คะแนนทันที', href: 'exam/', ready: true },
];

const ICONS = {
  book:   '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  upload: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>',
  exam:   '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  help:   '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  next:   '<path d="m9 18 6-6-6-6"/>',
  out:    '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>'
};
const svg = (name, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
// ตัดบรรทัดเฉพาะตรงช่องว่าง ไม่ให้คำไทยขาดกลางคำ
const phrases = s => String(s).split(' ').map(w => `<span class="nw">${esc(w)}</span>`).join(' ');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('menu').innerHTML = MENU.map(m => {
  const external = /^https?:\/\//.test(m.href);
  const ready = m.ready && (external || !/\s/.test(m.href));
  const body = `<span class="icon">${svg(m.icon)}</span>
    <span class="text"><h2>${esc(m.title)}</h2><p>${phrases(m.desc)}</p></span>`;
  return ready
    ? `<a class="item ${m.color}" href="${esc(m.href)}"${external ? ' target="_blank" rel="noopener"' : ''}>${body}<span class="go">${svg(external ? 'out' : 'next', 2.2)}</span></a>`
    : `<div class="item soon">${body}<span class="tag">เร็ว ๆ นี้</span></div>`;
}).join('');
</script>
</body>
</html>
