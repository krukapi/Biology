<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องเรียนชีววิทยา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6f4; --card:#fff; --ink:#1d2a23; --muted:#6a756f; --line:#dde4e0;
    --brand:#1e7a52; --brand-dark:#155c3d; --brand-soft:#e2f2ea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{background:var(--brand);color:#fff;padding:28px 0 24px}
  header h1{margin:0;font-size:26px}
  header p{margin:4px 0 0;opacity:.9}
  main{padding:24px 0 60px}
  .menu{display:grid;gap:14px}
  .item{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .1s,box-shadow .15s}
  a.item:hover{box-shadow:0 4px 14px rgba(30,122,82,.12)}
  a.item:active{transform:scale(.98)}
  .icon{flex:none;width:56px;height:56px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;font-size:28px}
  .text h2{margin:0;font-size:19px}
  .text p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .arrow{margin-left:auto;color:var(--brand);font-size:22px;font-weight:700}
  .item.soon{opacity:.55;cursor:default}
  .tag{margin-left:auto;font-size:12px;font-weight:700;background:#eceff1;color:var(--muted);padding:2px 10px;border-radius:999px;white-space:nowrap}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 30px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ห้องเรียนชีววิทยา</h1>
    <p>ม.4 · ภาคเรียนที่ 2/2569</p>
  </div>
</header>

<main class="wrap">
  <nav id="menu" class="menu"></nav>
</main>
<footer>โรงเรียนนางรอง</footer>

<script>
/* ===== เมนู: เพิ่ม/แก้ไขที่นี่ =====
   ready: true  = เปิดใช้งาน (กดเข้าได้)
   ready: false = ขึ้นว่า "เร็ว ๆ นี้"
   href ที่ขึ้นต้นด้วย https:// (เช่นลิงก์ Drive) จะเปิดในแท็บใหม่      */
const MENU = [
  { icon: '📚', title: 'เอกสารประกอบการเรียน', desc: 'ใบความรู้ สไลด์ และคลิปประกอบบทเรียน',
    href: 'https://drive.google.com/drive/folders/1R1bPkcombRQYffNQXrdRec1xtFyFqQGI?usp=drive_link', ready: true },
  { icon: '📤', title: 'ระบบส่งงาน',          desc: 'ส่งงาน ตอบคำถามท้ายคาบ ดูงานค้าง',  href: 'submit/', ready: true  },
  { icon: '📝', title: 'ระบบสอบ',             desc: 'ทำแบบทดสอบออนไลน์',                  href: 'exam/',   ready: false },
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('menu').innerHTML = MENU.map(m => {
  const body = `<span class="icon">${m.icon}</span>
    <span class="text"><h2>${esc(m.title)}</h2><p>${esc(m.desc)}</p></span>`;
  const external = /^https?:\/\//.test(m.href);
  const ready = m.ready && (external || !/\s/.test(m.href));   // ยังไม่ได้ใส่ลิงก์ = แสดงเป็น "เร็ว ๆ นี้"
  return ready
    ? `<a class="item" href="${esc(m.href)}"${external ? ' target="_blank" rel="noopener"' : ''}>${body}<span class="arrow">${external ? '↗' : '›'}</span></a>`
    : `<div class="item soon">${body}<span class="tag">เร็ว ๆ นี้</span></div>`;
}).join('');
</script>
</body>
</html>
