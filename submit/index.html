<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบส่งงาน</title>
<meta name="theme-color" content="#1a2332">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef5f4; --card:#fff; --ink:#1a2332; --muted:#647080; --line:#dae6e6;
    --brand:#1f6f70; --brand-dark:#185a5b; --brand-soft:#e2f1f0;
    --red:#b3261e; --red-soft:#fce8e6; --orange:#a35c00; --orange-soft:#fff1dc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{position:relative;overflow:hidden;background:linear-gradient(135deg,#1f6f70 0%,#2d8b8b 100%);color:#fff;padding:22px 0 26px;border-radius:0 0 26px 26px}
  header::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);right:-60px;top:-110px}
  header .wrap{position:relative;z-index:1}
  header h1{margin:0;font-size:23px;font-weight:600;letter-spacing:-.01em}
  .home{color:#fff;opacity:.85;font-size:14px;text-decoration:none;display:inline-block;margin-bottom:2px}
  .who{margin-top:4px;font-size:15px;opacity:.95;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  main.wrap{padding-top:22px;padding-bottom:60px}
  h2{font-size:19px;margin:4px 0 14px}
  .hidden{display:none!important}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 8px;font:inherit;font-size:20px;font-weight:600;color:var(--brand-dark);cursor:pointer;transition:transform .15s,box-shadow .15s}
  .tile:hover,.row:hover{box-shadow:0 8px 22px -12px rgba(26,35,50,.2)}
  .tile:active,.row:active{transform:scale(.98)}
  input[type=search]{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;color:var(--ink);transition:box-shadow .15s}
  .no{min-width:32px;height:32px;border-radius:10px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-weight:600;font-size:14px}
  .link{background:none;border:0;color:var(--brand);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
  .link.light{color:#fff;font-size:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs{background:#e6efef;padding:4px;border-radius:14px}
  .tab{flex:1;padding:9px;border-radius:11px;border:0;background:transparent;font:inherit;font-weight:500;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(26,35,50,.1)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(26,35,50,.04)}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .card h3{margin:6px 0 4px;font-size:18px;font-weight:600}
  .desc{margin:4px 0 8px;white-space:pre-wrap;color:#33413a}
  .due{margin:0 0 10px;font-size:14px;color:var(--muted)}
  .badge{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-orange{background:var(--orange-soft);color:var(--orange)}
  .b-green{background:var(--brand-soft);color:var(--brand-dark)}
  .b-grey{background:#ebf3f2;color:#5d6862}
  .card.fail{border-color:#f0b4ad;box-shadow:0 0 0 3px #fdeeec}
  .review{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14.5px}
  .review svg{flex:none;width:20px;height:20px;margin-top:1px}
  .review b{display:block;font-weight:600}
  .review p{margin:2px 0 0;white-space:pre-wrap;color:inherit}
  .rv-pending{background:#eff6f4;color:#4d5852}
  .rv-pass{background:var(--brand-soft);color:var(--brand-dark)}
  .rv-fail{background:var(--red-soft);color:var(--red)}
  .fail-alert{background:#fff;border:1.5px solid #f0b4ad;border-radius:16px;padding:14px 16px 10px;margin:0 0 14px;box-shadow:0 0 0 4px #fdeeec}
  .fail-alert.hidden{display:none}
  .fa-head{display:flex;gap:12px;align-items:flex-start}
  .fa-head svg{flex:none;width:24px;height:24px;color:var(--red);margin-top:1px}
  .fa-head b{display:block;font-size:16px;color:var(--red)}
  .fa-head span{display:block;font-size:14px;color:var(--muted);margin-top:1px}
  .fail-alert ul{list-style:none;padding:0;margin:8px 0 0 36px}
  .fail-alert li + li{border-top:1px solid #f6dcd8}
  .fail-alert li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 0;cursor:pointer}
  .fail-alert li button:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
  .fa-title{display:block;font-weight:600;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:#f0b4ad;text-underline-offset:3px}
  .fa-note{display:block;font-size:13.5px;color:#7b4a44;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,40%{box-shadow:0 0 0 6px #f6c9c3}100%{box-shadow:0 0 0 3px #fdeeec}}
  @media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
  .tab .dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:600;line-height:1}
  .sent{background:#f6fbf9;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
  .sent ul{margin:4px 0 0;padding-left:20px}
  .btn{width:100%;padding:12px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-weight:500;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-dark);border:0}
  .btn.ghost:hover{background:#d3e9e8}
  .btn:disabled{opacity:.6;cursor:wait}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .muted{color:var(--muted)}
  .banner{background:var(--red-soft);color:var(--red);padding:10px 14px;border-radius:12px;margin-bottom:14px}
  #loading{position:fixed;inset:0;background:rgba(238,245,244,.7);display:grid;place-items:center;font-weight:600;color:var(--brand-dark);z-index:20}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 24px;max-height:90vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
  .sheet h3{margin:0 0 4px}
  .drop{display:block;border:1.5px dashed #9ccfd1;border-radius:16px;padding:22px 12px;text-align:center;color:var(--brand-dark);font-weight:600;margin:14px 0;cursor:pointer;background:var(--brand-soft)}
  .drop input{display:none}
  #fileList{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
  #fileList li{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}
  .fthumb{flex:none;width:52px;height:52px;border-radius:8px;background:#e8f0f0 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);overflow:hidden}
  .fthumb svg{width:22px;height:22px}
  .fmeta{flex:1;min-width:0}
  .fname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .fstate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px}
  .fstate.ok{color:var(--green)}
  .fstate.err{color:var(--red)}
  .fbar{height:3px;border-radius:2px;background:#e3ecec;margin-top:6px;overflow:hidden}
  .fbar i{display:block;height:100%;width:40%;background:var(--green-2,#2d8b8b);border-radius:2px;animation:fbar 1.1s ease-in-out infinite}
  @keyframes fbar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.fbar i{animation:none;width:100%;opacity:.5}}
  .fdel{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .fdel:hover{background:#fdeeec;color:var(--red)}
  .fdel svg{width:18px;height:18px}
  #mMsg{min-height:22px;font-size:14px;margin-bottom:10px}
  #mMsg.err{color:var(--red)}
  .actions{display:flex;gap:10px}
  .pin{width:100%;padding:14px;font:inherit;font-size:20px;letter-spacing:4px;text-align:center;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
  .pin:focus{outline:2px solid var(--brand);border-color:transparent}
  #pinMsg{min-height:22px;font-size:14px;color:var(--red);margin-bottom:10px}
  .score{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px}
  .score-label{font-weight:600;font-size:16px}
  .score-note{font-size:13px;color:var(--muted)}
  .score-num{font-size:34px;font-weight:600;color:var(--brand);white-space:nowrap;line-height:1;letter-spacing:-.02em}
  .score-num small{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
  #quizBox{margin:14px 0 6px}
  .ann-btn{width:100%;display:flex;align-items:center;gap:10px;background:#fff8e6;border:1px solid #f3dfae;color:#7a5200;border-radius:16px;padding:11px 14px;margin-bottom:12px;font:inherit;font-weight:500;cursor:pointer;text-align:left}
  .ann-btn svg{flex:none;width:20px;height:20px}
  .ann-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ann-btn b{flex:none;background:#d9730d;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
  .ann{position:fixed;inset:0;z-index:30;background:rgba(16,24,36,.55);display:flex;align-items:center;justify-content:center;padding:18px}
  .ann-card{background:#fff;border-radius:22px;width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
  .ann-top{background:#1a2332 url(../depth.svg) no-repeat right -160px center/auto 240%;border-bottom:3px solid #f0a83a;color:#fff;padding:18px 20px 16px;display:flex;align-items:center;gap:12px}
  .ann-top svg{color:#f6c26b}
  .ann-top svg{flex:none;width:30px;height:30px}
  .ann-top b{display:block;font-size:13px;font-weight:500;opacity:.9}
  .ann-top h3{font-size:19px;font-weight:600;line-height:1.3;margin:0}
  .ann-body{padding:18px 20px;overflow:auto;white-space:pre-wrap;line-height:1.65;color:var(--ink);font-size:16px}
  .ann-body a{color:var(--brand);word-break:break-all}
  .ann-meta{padding:0 20px 4px;font-size:13px;color:var(--muted)}
  .ann-foot{padding:14px 20px 18px;display:flex;gap:10px;align-items:center}
  .ann-foot small{color:var(--muted);margin-right:auto}
  .ann-foot .btn{width:auto;padding:11px 22px}
  .ann-list{padding:6px 20px 4px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .ann-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .ann-item h4{margin:0 0 4px;font-size:15.5px;font-weight:600}
  .ann-item p{margin:0;white-space:pre-wrap;font-size:14.5px;line-height:1.6}
  .ann-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
  .q{margin-bottom:16px}
  .q label{display:block;font-weight:600;margin-bottom:6px;white-space:pre-wrap}
  fieldset.q{border:0;padding:0}
  .q legend{font-weight:600;margin-bottom:8px;padding:0;white-space:pre-wrap}
  .q label.choice{display:flex;align-items:center;gap:12px;font-weight:400;white-space:normal;padding:11px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .choice:hover{border-color:#b4d8d9}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .cl{flex:none;width:28px;height:28px;border-radius:9px;background:#ebf3f2;color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:14px;transition:background .15s,color .15s}
  .choice:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
  .choice:has(input:checked) .cl{background:var(--brand);color:#fff}
  .choice:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
  .q textarea{width:100%;min-height:90px;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:12px;resize:vertical}
  .q textarea:focus{outline:2px solid var(--brand);border-color:transparent}
  .type{font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand-dark);padding:1px 8px;border-radius:999px;margin-right:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:30;max-width:90vw;text-align:center}
  .sample-btn{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 0;padding:12px 14px;border:1px solid #cfe3e3;border-radius:14px;background:#f2f8f8;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
  .sample-btn:hover{background:#e6f2f2}
  .sample-btn svg{flex:none;width:22px;height:22px;color:var(--brand)}
  .sample-btn b{display:block;font-size:15px;font-weight:600;color:var(--brand)}
  .sample-btn small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
  .sample-wait{margin:10px 0 0;font-size:13px;color:var(--muted)}
  .samp{position:fixed;inset:0;z-index:30;background:rgba(16,24,36,.55);display:flex;align-items:flex-end;justify-content:center}
  .samp.hidden,.szoom.hidden{display:none}
  .samp-card{background:var(--bg,#eef5f4);width:100%;max-width:720px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:640px){.samp{align-items:center;padding:24px}.samp-card{border-radius:20px}}
  .samp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 6px;background:#fff}
  .samp-head small{display:block;font-size:13px;color:var(--muted)}
  .samp-head h2{font-size:19px;font-weight:600;line-height:1.35}
  .samp-x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:#eef3f3;color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .samp-x svg{width:20px;height:20px}
  .samp-note{background:#fff;padding:0 18px 14px;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);margin:0}
  .samp-body{overflow:auto;padding:14px 14px 24px;display:grid;gap:12px;overscroll-behavior:contain}
  .s-load{padding:40px 16px;text-align:center;color:var(--muted)}
  .s-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .s-item h3{font-size:15px;font-weight:600;margin-bottom:10px}
  .s-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .s-img{aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;background:#f3f7f7;padding:0;overflow:hidden;cursor:zoom-in;display:grid;place-items:center;color:var(--muted);font:inherit;font-size:13px}
  .s-img img{width:100%;height:100%;object-fit:cover;display:block}
  .s-qa + .s-qa{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .s-q{font-size:14px;color:var(--muted);margin:0}
  .s-a{font-size:15px;margin:4px 0 0;white-space:pre-wrap}
  .szoom{position:fixed;inset:0;z-index:40;background:rgba(10,16,26,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
  .szoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .syncing{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;background:#1a2332;color:#a8dadc;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px -8px rgba(16,24,36,.5)}
  .syncing.hidden{display:none}
</style>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="home" href="../">← หน้าหลัก</a>
    <h1>ระบบส่งงาน</h1>
    <div id="who" class="who"></div>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner hidden"></div>
  <div id="syncing" class="syncing hidden" role="status">กำลังอัปเดตข้อมูลล่าสุด…</div>

  <section id="step-room" class="hidden">
    <h2>เลือกห้องเรียน</h2>
    <div id="rooms" class="grid"></div>
  </section>

  <section id="step-name" class="hidden">
    <button class="link" onclick="backToRooms()">← เปลี่ยนห้อง</button>
    <h2>เลือกชื่อของตัวเอง <span id="roomLabel" class="muted"></span></h2>
    <input id="search" type="search" placeholder="ค้นหาชื่อหรือเลขที่" oninput="renderStudents()">
    <div id="students" class="list"></div>
  </section>

  <section id="step-pin" class="hidden">
    <button class="link" onclick="logout()">← เลือกชื่อใหม่</button>
    <h2 id="pinTitle"></h2>
    <p id="pinHelp" class="muted"></p>
    <input id="pin1" class="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="เลขประจำตัวนักเรียน" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="pin2" class="pin hidden" type="password" inputmode="numeric" autocomplete="off" placeholder="กรอกเลขประจำตัวอีกครั้ง" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="pinMsg"></div>
    <button id="pinBtn" class="btn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </section>

  <section id="step-tasks" class="hidden">
    <button id="annBtn" class="ann-btn hidden" onclick="openAnnList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
      <span id="annBtnText">ประกาศจากครู</span><b id="annBtnCount"></b>
    </button>
    <div class="score">
      <div>
        <div class="score-label">คะแนนปัจจุบัน</div>
        <div class="score-note" id="scoreNote"></div>
      </div>
      <div class="score-num"><span id="scoreVal">–</span><small id="scoreFull"></small></div>
    </div>
    <div id="failAlert" class="fail-alert hidden" role="alert"></div>
    <div class="tabs">
      <button id="tabPending" class="tab on" onclick="setTab('pending')">งานค้าง</button>
      <button id="tabDone" class="tab" onclick="setTab('done')">ส่งแล้ว</button>
    </div>
    <div id="tasks"></div>
  </section>
</main>

<div id="modal" class="modal hidden" onclick="if(event.target===this && state.task.type!=='quiz')closeUpload()">
  <div class="sheet">
    <h3 id="mTitle"></h3>
    <div id="mInfo" class="muted"></div>
    <div id="fileBox">
      <label class="drop">
        <input id="fileInput" type="file" multiple onchange="addFiles(this.files)">
        แตะเพื่อเลือกไฟล์หรือถ่ายรูป <span class="muted" style="font-weight:400">· เลือกได้หลายไฟล์ ระบบเริ่มอัปโหลดให้ทันที</span>
      </label>
      <ul id="fileList"></ul>
    </div>
    <div id="quizBox"></div>
    <div id="mMsg"></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeUpload()">ยกเลิก</button>
      <button id="sendBtn" class="btn" onclick="send()">ส่งงาน</button>
    </div>
  </div>
</div>

<div id="samp" class="samp hidden" role="dialog" aria-modal="true" aria-labelledby="sTitle" onclick="if(event.target===this)closeSamples()">
  <div class="samp-card">
    <div class="samp-head">
      <div><small>ตัวอย่างงานของเพื่อนในห้อง</small><h2 id="sTitle"></h2></div>
      <button type="button" id="sClose" class="samp-x" onclick="closeSamples()" aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <p class="samp-note">งานที่ครูตรวจผ่านแล้ว ไม่แสดงชื่อเจ้าของงาน ใช้ดูเป็นแนวทาง แล้วทำงานของตัวเอง ห้ามคัดลอก</p>
    <div id="sBody" class="samp-body"></div>
  </div>
</div>
<div id="sZoom" class="szoom hidden" onclick="this.classList.add('hidden')" role="dialog" aria-label="รูปขยาย"><img id="sZoomImg" alt=""></div>
<div id="ann" class="ann hidden" role="dialog" aria-modal="true" aria-labelledby="annTitle"><div class="ann-card" id="annCard"></div></div>
<div id="loading">กำลังโหลด…</div>

<script src="../config.js"></script>
<script>

const MAX_MB = 20;
const LABELS = ['ก', 'ข', 'ค', 'ง', 'จ', 'ฉ', 'ช', 'ซ'];
const state = { rooms: [], room: null, students: [], student: null, tasks: [], tab: 'pending', task: null, files: [], busy: false };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roomName = r => 'ม.' + String(r).replace('-', '/');
const errText = e => String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '').replace('AUTH:', '');
const isAuth = e => String((e && e.message) || e).includes('AUTH:');

// เรียก Apps Script ผ่าน fetch (ส่งแบบ text/plain เพื่อเลี่ยงปัญหา CORS)
async function run(action, ...args) {
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, args }) });
  } catch (e) {
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
  const out = await res.json().catch(() => null);
  if (!out) throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (ตรวจสอบ API_URL และสิทธิ์ "ทุกคน")');
  if (!out.ok) throw new Error(out.error);
  return out.data;
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function loading(on) { $('loading').classList.toggle('hidden', !on); }
function show(id) { ['step-room','step-name','step-pin','step-tasks'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function banner(e) { const b = $('banner'); if (!e) return b.classList.add('hidden'); b.textContent = errText(e); b.classList.remove('hidden'); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }

async function init() {
  // เคยเข้าระบบในเครื่องนี้แล้ว → เข้าหน้างานทันที ไม่ต้องโหลดรายชื่อห้อง/นักเรียนใหม่
  const r0 = load('room'), n0 = load('no'), p0 = load('pin'), nm = load('name');
  if (r0 && n0 && p0 && nm) {
    state.room = r0; state.student = { no: n0, name: nm }; state.pin = p0;
    $('roomLabel').textContent = roomName(r0);
    return enterTasks();
  }
  loading(true);
  try {
    state.rooms = await run('getRooms');
    const r = load('room');
    if (r && state.rooms.includes(r)) await pickRoom(r, load('no'));
    else showRooms();
  } catch (e) { banner(e); }
  loading(false);
}

async function backToRooms() {
  if (!state.rooms.length) { loading(true); try { state.rooms = await run('getRooms'); } catch (e) { banner(e); } loading(false); }
  showRooms();
}
function showRooms() {
  banner(null);
  $('who').innerHTML = '';
  $('rooms').innerHTML = state.rooms.map(r =>
    `<button class="tile" onclick="pickRoom('${esc(r)}')">${esc(roomName(r))}</button>`).join('')
    || '<p class="muted">ยังไม่มีห้องในระบบ</p>';
  show('step-room');
}

async function pickRoom(room, autoNo) {
  loading(true); banner(null);
  try {
    state.room = room;
    state.students = await run('getStudents', room);
    store('room', room);
    $('roomLabel').textContent = roomName(room);
    const s = autoNo && state.students.find(x => String(x.no) === String(autoNo));
    if (s) { await pickStudent(s.no); }
    else { $('search').value = ''; renderStudents(); show('step-name'); }
  } catch (e) { banner(e); }
  loading(false);
}

function renderStudents() {
  const q = $('search').value.trim();
  $('students').innerHTML = state.students
    .filter(s => !q || s.name.includes(q) || String(s.no) === q)
    .map(s => `<button class="row" onclick="pickStudent('${esc(s.no)}')"><span class="no">${esc(s.no)}</span>${esc(s.name)}</button>`)
    .join('') || '<p class="muted">ไม่พบชื่อ</p>';
}

async function pickStudent(no) {
  state.student = state.students.find(s => String(s.no) === String(no));
  state.pin = (load('no') === String(no) && load('pin')) || null;
  if (state.pin) await enterTasks();
  else await showPin();
}

async function showPin() {
  loading(true); banner(null);
  try {
    const st = await run('getAuthState', state.room, state.student.no);
    state.firstTime = !st.registered;
    $('pinTitle').textContent = `${state.student.name} · เลขที่ ${state.student.no}`;
    $('pinHelp').textContent = state.firstTime
      ? 'เข้าใช้ครั้งแรก: กรอกเลขประจำตัวนักเรียน 2 ครั้ง เลขนี้จะใช้ยืนยันตัวตนทุกครั้งต่อไป'
      : 'กรอกเลขประจำตัวนักเรียนเพื่อยืนยันตัวตน';
    $('pin1').value = ''; $('pin2').value = '';
    $('pin2').classList.toggle('hidden', !state.firstTime);
    $('pinBtn').textContent = state.firstTime ? 'ลงทะเบียนและเข้าสู่ระบบ' : 'เข้าสู่ระบบ';
    $('pinMsg').textContent = '';
    $('who').innerHTML = '';
    show('step-pin');
    setTimeout(() => $('pin1').focus(), 50);
  } catch (e) { banner(e); }
  loading(false);
}

async function doLogin() {
  const p1 = $('pin1').value.replace(/\s/g, ''), p2 = $('pin2').value.replace(/\s/g, '');
  if (!/^\d{4,10}$/.test(p1)) return ($('pinMsg').textContent = 'เลขประจำตัวต้องเป็นตัวเลข 4–10 หลัก');
  if (state.firstTime && p1 !== p2) return ($('pinMsg').textContent = 'เลขทั้งสองช่องไม่ตรงกัน');
  $('pinBtn').disabled = true; $('pinMsg').textContent = '';
  loading(true);
  try {
    await run('login', state.room, state.student.no, p1);
    state.pin = p1;
    store('no', state.student.no); store('pin', p1); store('name', state.student.name);
    loading(false);
    await enterTasks();
  } catch (e) {
    loading(false);
    $('pinMsg').textContent = errText(e);
  } finally { $('pinBtn').disabled = false; }
}

async function enterTasks() {
  store('name', state.student.name);
  $('who').innerHTML = `<span>${esc(state.student.name)} · ${esc(roomName(state.room))} เลขที่ ${esc(state.student.no)}</span>
    <button class="link light" onclick="logout()">ออกจากระบบ</button>`;
  state.tab = 'pending';
  show('step-tasks');
  await loadTasks();
}

function authFail() {
  store('pin', null); state.pin = null; state.busy = false;
  $('modal').classList.add('hidden');
  showPin();
}

async function logout() {
  state.annLoaded = false; state.anns = []; $('annBtn').classList.add('hidden');
  if (state.student) store(homeKey(), null);
  store('no', null); store('pin', null); store('name', null);
  state.student = null; state.pin = null;
  $('who').innerHTML = '';
  $('search').value = '';
  if (!state.students.length) {                   // เข้ามาทางลัด ยังไม่มีรายชื่อ → โหลดก่อน
    loading(true);
    try { state.students = await run('getStudents', state.room); } catch (e) { banner(e); }
    loading(false);
  }
  renderStudents();
  show('step-name');
}

const homeKey = () => `home:${state.room}:${state.student.no}`;
async function loadTasks() {
  // แสดงข้อมูลล่าสุดที่เคยโหลดไว้ทันที แล้วค่อยอัปเดตจากเซิร์ฟเวอร์ (โหลดครั้งเดียวได้ทั้งงาน คะแนน ประกาศ)
  let cachedShown = false;
  try {
    const c = JSON.parse(load(homeKey()) || 'null');
    if (c && c.tasks) { state.tasks = c.tasks; renderTasks(); renderScore(c.score); cachedShown = true; }
  } catch (e) {}
  if (cachedShown) $('syncing').classList.remove('hidden'); else loading(true);
  try {
    const h = await run('studentHome', state.room, state.student.no, state.pin);
    state.tasks = h.tasks;
    renderTasks();
    renderScore(h.score);
    store(homeKey(), JSON.stringify({ tasks: h.tasks, score: h.score }));
    if (!state.annLoaded) { state.annLoaded = true; showAnnouncements(h.anns || []); }   // ประกาศ: ครั้งเดียวต่อการเข้าระบบ
  }
  catch (e) { loading(false); $('syncing').classList.add('hidden'); if (isAuth(e)) return authFail(); banner(e); }
  loading(false); $('syncing').classList.add('hidden');
}

/* ---------- ประกาศจากครู ---------- */
const MEGAPHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>';
const linkify = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
async function loadAnnouncements() {
  state.annLoaded = true;
  let a;
  try { a = await run('getAnnouncements', state.room, state.student.no, state.pin); }
  catch (e) { state.anns = []; return; }
  showAnnouncements(a);
}
function showAnnouncements(a) {
  state.anns = a || [];
  renderAnnBtn();
  state.annQueue = state.anns.filter(a => !a.seen);
  if (state.annQueue.length) showNextAnn();
}
function renderAnnBtn() {
  const a = state.anns || [], unseen = a.filter(x => !x.seen).length;
  $('annBtn').classList.toggle('hidden', !a.length);
  if (!a.length) return;
  $('annBtnText').textContent = a[0].title || a[0].message.split('\n')[0];
  $('annBtnCount').textContent = unseen ? `ใหม่ ${unseen}` : `${a.length} ประกาศ`;
}
function showNextAnn() {
  const q = state.annQueue, a = q[0];
  if (!a) return $('ann').classList.add('hidden');
  const total = state.anns.filter(x => !x.seen).length + (state.annDone || 0);
  const idx = (state.annDone || 0) + 1;
  $('annCard').innerHTML = `
    <div class="ann-top">${MEGAPHONE}<div><b>ประกาศจากครู${total > 1 ? ` · ${idx}/${total}` : ''}</b><h3 id="annTitle">${esc(a.title || 'ประกาศ')}</h3></div></div>
    <div class="ann-body">${linkify(a.message)}</div>
    <div class="ann-meta">${esc(a.date)}</div>
    <div class="ann-foot"><small>${q.length > 1 ? `มีอีก ${q.length - 1} ประกาศ` : ''}</small>
      <button class="btn" id="annAck" onclick="ackAnn()">${q.length > 1 ? 'รับทราบ ถัดไป →' : 'รับทราบ'}</button></div>`;
  $('ann').classList.remove('hidden');
  setTimeout(() => { const b = $('annAck'); if (b) b.focus(); }, 50);
}
function ackAnn() {
  const a = state.annQueue.shift();
  if (a) { a.seen = true; state.annDone = (state.annDone || 0) + 1; run('ackAnnouncement', state.room, state.student.no, state.pin, a.id).catch(() => {}); }
  renderAnnBtn();
  if (state.annQueue.length) showNextAnn();
  else { $('ann').classList.add('hidden'); state.annDone = 0; }
}
function openAnnList() {
  const a = state.anns || [];
  $('annCard').innerHTML = `
    <div class="ann-top">${MEGAPHONE}<div><b>ประกาศจากครู</b><h3 id="annTitle">ประกาศทั้งหมด ${a.length} รายการ</h3></div></div>
    <div class="ann-list">${a.map(x => `<div class="ann-item">${x.title ? `<h4>${esc(x.title)}</h4>` : ''}<p>${linkify(x.message)}</p><small>${esc(x.date)}</small></div>`).join('')}</div>
    <div class="ann-foot"><small></small><button class="btn" onclick="$('ann').classList.add('hidden')">ปิด</button></div>`;
  $('ann').classList.remove('hidden');
  a.filter(x => !x.seen).forEach(x => { x.seen = true; run('ackAnnouncement', state.room, state.student.no, state.pin, x.id).catch(() => {}); });
  renderAnnBtn();
}

function setTab(t) { state.tab = t; renderTasks(); }

function renderScore(s) {
  const has = s && typeof s.total === 'number';
  $('scoreVal').textContent = has ? s.total : '–';
  $('scoreFull').textContent = '/ ' + ((s && s.full) || 100);
  $('scoreNote').textContent = has ? 'คะแนนเก็บ + สอบ ที่ครูกรอกแล้ว' : 'ยังไม่มีคะแนน';
}

function renderTasks() {
  const pending = state.tasks.filter(t => !t.submitted);
  const rank = { fail: 0, pending: 1, pass: 2 };
  const done = state.tasks.filter(t => t.submitted).sort((a, b) => (rank[a.review] ?? 1) - (rank[b.review] ?? 1));
  const fails = done.filter(t => t.review === 'fail').length;
  $('tabPending').textContent = `งานค้าง (${pending.length})`;
  $('tabDone').innerHTML = `ส่งแล้ว (${done.length})${fails ? `<span class="dot" aria-label="ต้องแก้ ${fails} งาน">${fails}</span>` : ''}`;
  $('tabPending').classList.toggle('on', state.tab === 'pending');
  $('tabDone').classList.toggle('on', state.tab === 'done');
  renderFailAlert(done.filter(t => t.review === 'fail'));
  const list = state.tab === 'pending' ? pending : done;
  $('tasks').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty">${state.tab === 'pending' ? 'ไม่มีงานค้าง เยี่ยมมาก' : 'ยังไม่มีงานที่ส่ง'}</div>`;
}

/* แจ้งเตือนงานที่ตรวจไม่ผ่าน: แสดงทั้งสองแท็บ จนกว่านักเรียนจะแก้แล้วส่งใหม่ */
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
function renderFailAlert(fails) {
  const el = $('failAlert');
  if (!fails.length) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  const head = `<div class="fa-head">${X_ICON}<div><b>มีงานที่ตรวจไม่ผ่าน ${fails.length} งาน</b>
    <span>${state.tab === 'done' ? 'อ่านสิ่งที่ครูให้แก้ แล้วกดส่งใหม่ในงานนั้น' : 'แก้ตามที่ครูบอก แล้วส่งใหม่ให้ครูตรวจอีกครั้ง'}</span></div></div>`;
  const items = fails.map(t => `<li><button type="button" onclick="goFail('${esc(t.id)}')">
      <span class="fa-title">${esc(t.title)}</span>${t.note ? `<span class="fa-note">ครูบอกว่า: ${esc(t.note)}</span>` : ''}
    </button></li>`).join('');
  el.innerHTML = head + `<ul>${items}</ul>`;
  el.classList.remove('hidden');
}
function goFail(id) {
  if (state.tab !== 'done') setTab('done');
  const c = document.getElementById('task-' + id);
  if (!c) return;
  c.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
}

function card(t) {
  let badge = '';
  if (!t.submitted) badge = t.overdue ? '<span class="badge b-red">เลยกำหนด</span>' : '';
  else badge = { pass: '<span class="badge b-green">ผ่าน</span>', fail: '<span class="badge b-red">ไม่ผ่าน · ต้องแก้</span>' }[t.review]
    || '<span class="badge b-grey">รอตรวจ</span>';
  const late = t.submitted && t.status === 'ส่งช้า' ? ' · <span style="color:var(--orange)">ส่งช้า</span>' : '';
  const quiz = t.type === 'quiz';
  const files = quiz ? '' : t.files.map(f => `<li>${esc(f.name)}</li>`).join('');
  const typeTag = quiz ? `<span class="type">ตอบคำถาม ${t.questions.length} ข้อ</span>` : '';
  const fail = t.review === 'fail';
  const btnText = fail ? (quiz ? 'แก้คำตอบแล้วส่งใหม่' : 'แก้งานแล้วส่งใหม่')
    : quiz ? (t.submitted ? 'แก้ไขคำตอบ' : 'ตอบคำถาม') : (t.submitted ? 'แก้ไข / ส่งใหม่' : 'ส่งงาน');
  const RV = {
    pending: ['rv-pending', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'รอครูตรวจ'],
    pass: ['rv-pass', '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>', 'ตรวจแล้ว ผ่าน'],
    fail: ['rv-fail', '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>', 'ไม่ผ่าน กรุณาแก้ไขแล้วส่งใหม่']
  }[t.review];
  const review = t.submitted && RV ? `<div class="review ${RV[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${RV[1]}</svg>
      <div><b>${RV[2]}</b>${t.note ? `<p>ครู: ${esc(t.note)}</p>` : ''}</div></div>` : '';
  return `<article class="card${fail ? ' fail' : ''}" id="task-${esc(t.id)}">
    <div class="card-top"><span>${typeTag}${esc(t.period)} · ${esc(t.full)} คะแนน</span>${badge}</div>
    <h3>${esc(t.title)}</h3>
    ${t.desc ? `<p class="desc">${esc(t.desc)}</p>` : ''}
    <p class="due">${t.dueText ? 'กำหนดส่ง ' + esc(t.dueText) : 'ไม่มีกำหนดส่ง'}</p>
    ${review}
    ${sampleRow(t)}
    ${t.submitted ? `<div class="sent">ส่งล่าสุด ${esc(t.submittedAt)}${t.count > 1 ? ` (ส่ง ${t.count} ครั้ง)` : ''}${late}${files ? `<ul>${files}</ul>` : ''}</div>` : ''}
    <button class="btn ${t.submitted && !fail ? 'ghost' : ''}" onclick="openUpload('${esc(t.id)}')">${btnText}</button>
  </article>`;
}

/* ---------- ตัวอย่างงานจากเพื่อน (เปิดเมื่อครูตรวจเกินครึ่งห้อง) ---------- */
const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function sampleRow(t) {
  const sm = t.sample || {};
  if (t.review === 'pass') return '';
  if (sm.ready) return `<button type="button" class="sample-btn" onclick="openSamples('${esc(t.id)}')">${EYE_ICON}
      <span><b>ดูตัวอย่างงานของเพื่อน</b><small>งานที่ครูตรวจผ่านแล้ว ใช้เป็นแนวทาง</small></span></button>`;
  if (sm.pct > 0) return `<p class="sample-wait">ตัวอย่างงานของเพื่อนจะเปิดให้ดูเมื่อครูตรวจเกินครึ่งห้อง (ตอนนี้ ${sm.pct}%)</p>`;
  return '';
}
const SAMP_IMG = {};
let SAMP_N = 0; const SAMP_Q = [];
function sampImg(taskId, id) {
  if (!SAMP_IMG[id]) SAMP_IMG[id] = new Promise((res, rej) => { SAMP_Q.push({ taskId, id, res, rej }); pumpSamp(); })
    .catch(e => { delete SAMP_IMG[id]; throw e; });
  return SAMP_IMG[id];
}
function pumpSamp() {
  while (SAMP_N < 3 && SAMP_Q.length) {
    const j = SAMP_Q.shift(); SAMP_N++;
    run('studentSampleFile', state.room, state.student.no, state.pin, j.taskId, j.id)
      .then(r => j.res(r.image ? `data:${r.mime};base64,${r.data}` : null), j.rej)
      .finally(() => { SAMP_N--; pumpSamp(); });
  }
}
async function openSamples(id) {
  state.sampTask = id;
  const t = state.tasks.find(x => x.id === id);
  $('sTitle').textContent = t ? t.title : 'ตัวอย่างงาน';
  $('sBody').innerHTML = '<div class="s-load">กำลังโหลดตัวอย่าง…</div>';
  $('samp').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $('sClose').focus();
  try {
    const d = await run('getSamples', state.room, state.student.no, state.pin, id);
    if (!d.samples.length) { $('sBody').innerHTML = '<div class="s-load">ยังไม่มีตัวอย่างที่แสดงได้ (งานที่ผ่านอาจเป็นไฟล์ PDF หรือข้อปรนัย)</div>'; return; }
    $('sBody').innerHTML = d.samples.map((x, i) => `<section class="s-item">
        <h3>${esc(x.label)}</h3>
        ${x.files ? `<div class="s-imgs">${x.files.map(f => `<button type="button" class="s-img" data-id="${esc(f)}" onclick="sampZoom(this)" aria-label="ขยายรูป ${esc(x.label)}"><span>กำลังโหลดรูป…</span></button>`).join('')}</div>` : ''}
        ${x.answers ? x.answers.map(q => `<div class="s-qa"><p class="s-q">${esc(q.q)}</p><p class="s-a">${esc(q.a)}</p></div>`).join('') : ''}
      </section>`).join('');
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      const b = en.target;
      sampImg(id, b.dataset.id).then(src => { b.innerHTML = src ? `<img src="${src}" alt="" decoding="async">` : '<span>เปิดไฟล์นี้ไม่ได้</span>'; })
        .catch(() => { b.innerHTML = '<span>โหลดรูปไม่สำเร็จ แตะเพื่อลองใหม่</span>'; b.dataset.retry = '1'; });
    }), { root: $('sBody'), rootMargin: '800px 0px' });
    $('sBody').querySelectorAll('.s-img').forEach(b => io.observe(b));
  } catch (e) {
    if (isAuth(e)) { closeSamples(); return authFail(); }
    $('sBody').innerHTML = `<div class="s-load">${esc(errText(e))}</div>`;
  }
}
function sampZoom(b) {
  const img = b.querySelector('img');
  if (!img) {
    if (b.dataset.retry) { b.dataset.retry = ''; b.innerHTML = '<span>กำลังโหลดรูป…</span>';
      sampImg(state.sampTask, b.dataset.id).then(src => { b.innerHTML = src ? `<img src="${src}" alt="" decoding="async">` : '<span>เปิดไฟล์นี้ไม่ได้</span>'; }).catch(() => { b.innerHTML = '<span>โหลดรูปไม่สำเร็จ แตะเพื่อลองใหม่</span>'; b.dataset.retry = '1'; }); }
    return;
  }
  $('sZoomImg').src = img.src; $('sZoom').classList.remove('hidden');
}
function closeSamples() {
  $('samp').classList.add('hidden'); $('sZoom').classList.add('hidden');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('sZoom').classList.contains('hidden')) return $('sZoom').classList.add('hidden');
  if (!$('samp').classList.contains('hidden')) closeSamples();
});

/* ---------- อัปโหลด ---------- */
function openUpload(id) {
  state.task = state.tasks.find(t => t.id === id);
  state.files = [];
  $('mTitle').textContent = state.task.title;
  const notes = [];
  if (state.task.overdue) notes.push('เลยกำหนดส่งแล้ว ยังส่งได้ แต่จะบันทึกว่าส่งช้า');
  const quiz = state.task.type === 'quiz';
  if (state.task.submitted) notes.push(quiz ? 'แก้คำตอบแล้วกดส่งอีกครั้งได้' : 'การส่งใหม่จะแทนที่ไฟล์ที่ส่งไว้เดิม');
  $('mInfo').textContent = notes.join(' · ');
  msg('');
  $('fileBox').classList.toggle('hidden', quiz);
  $('quizBox').classList.toggle('hidden', !quiz);
  $('sendBtn').textContent = quiz ? 'ส่งคำตอบ' : 'ส่งงาน';
  if (quiz) {
    $('quizBox').innerHTML = state.task.questions.length
      ? state.task.questions.map((q, i) => {
          const prev = state.task.answers[i] || '';
          if (q.choices && q.choices.length) {
            return `<fieldset class="q" id="ans${i}"><legend>${i + 1}. ${esc(q.text)}</legend>
              ${q.choices.map((c, j) => `<label class="choice"><input type="radio" name="q${i}" value="${esc(c)}"${c === prev ? ' checked' : ''}>
                <span class="cl">${LABELS[j] || j + 1}</span><span>${esc(c)}</span></label>`).join('')}
            </fieldset>`;
          }
          return `<div class="q"><label for="ans${i}">${i + 1}. ${esc(q.text)}</label>
            <textarea id="ans${i}" placeholder="พิมพ์คำตอบ">${esc(prev)}</textarea></div>`;
        }).join('')
      : '<p class="muted">ครูยังไม่ได้เพิ่มคำถามสำหรับงานนี้</p>';
  }
  renderFiles();
  $('modal').classList.remove('hidden');
}
function closeUpload() {
  if (state.busy) return;
  state.files.forEach(x => { x.removed = true; if (x.thumb) URL.revokeObjectURL(x.thumb); });
  $('modal').classList.add('hidden');
}

/* ---------- อัปโหลด: เริ่มส่งทันทีที่เลือกไฟล์ (ย่อรูปก่อน) ทีละ 3 ไฟล์พร้อมกัน ----------
   กด "ส่งงาน" แล้วแค่รอไฟล์ที่ยังค้างเสร็จ + บันทึก จึงเร็วกว่าเดิมมาก */
const UP_PARALLEL = 3;
const TRANSIENT = /ล็อก|lock|timed out|หมดเวลา|busy|too many|เชื่อมต่อเซิร์ฟเวอร์ไม่ได้|ผิดรูปแบบ/i;
let upSeq = 0;
function addFiles(list) {
  for (const f of list) {
    if (f.size > MAX_MB * 1024 * 1024 && !/^image\//.test(f.type)) { msg(`ไฟล์ ${f.name} ใหญ่เกิน ${MAX_MB} MB`, true); continue; }
    const it = { id: ++upSeq, file: f, name: f.name, state: 'wait', thumb: /^image\//.test(f.type) ? URL.createObjectURL(f) : '' };
    state.files.push(it);
  }
  $('fileInput').value = '';
  renderFiles(); pumpUploads();
}
function removeFile(id) {
  const i = state.files.findIndex(x => x.id === id); if (i < 0) return;
  const it = state.files[i];
  if (it.thumb) URL.revokeObjectURL(it.thumb);
  it.removed = true; state.files.splice(i, 1);
  renderFiles();
}
function pumpUploads() {
  const active = state.files.filter(x => x.state === 'prep' || x.state === 'up').length;
  state.files.filter(x => x.state === 'wait').slice(0, Math.max(0, UP_PARALLEL - active)).forEach(uploadOne);
}
async function uploadOne(it) {
  const task = state.task;
  it.state = 'prep'; renderFiles();
  try {
    const f = await prepare(it.file);
    if (it.removed) return;
    if (f.size > MAX_MB * 1024 * 1024) throw new Error(`ใหญ่เกิน ${MAX_MB} MB`);
    it.state = 'up'; it.size = f.size; renderFiles();
    const data = await toBase64(f.blob);
    let r, tries = 0;
    while (true) {                                   // เน็ตสะดุด/เซิร์ฟเวอร์ยุ่ง → ลองใหม่เอง 2 ครั้ง
      try {
        r = await run('uploadFile', { room: state.room, no: state.student.no, name: state.student.name, pin: state.pin,
          taskId: task.id, fileName: f.name, mimeType: f.type, data });
        break;
      } catch (e) { if (isAuth(e) || !TRANSIENT.test(errText(e)) || ++tries > 2) throw e; await new Promise(z => setTimeout(z, 1200 * tries)); }
    }
    if (it.removed || state.task !== task) return;
    it.state = 'done'; it.result = r;
  } catch (e) {
    if (isAuth(e)) return authFail();
    it.state = 'err'; it.err = errText(e);
  }
  renderFiles(); pumpUploads(); maybeFinish();
}
function retryFile(id) { const it = state.files.find(x => x.id === id); if (it) { it.state = 'wait'; it.err = ''; renderFiles(); pumpUploads(); } }
const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const DEL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function renderFiles() {
  const label = it => ({
    wait: 'รอคิว', prep: 'กำลังย่อรูป…', up: 'กำลังอัปโหลด…',
    done: `อัปโหลดแล้ว${it.size ? ` · ${(it.size / 1048576).toFixed(1)} MB` : ''}`,
    err: `ไม่สำเร็จ: ${it.err} · <button type="button" class="link" onclick="retryFile(${it.id})">ลองใหม่</button>`
  })[it.state];
  $('fileList').innerHTML = state.files.map(it => `<li>
      <span class="fthumb" ${it.thumb ? `style="background-image:url('${it.thumb}')"` : ''}>${it.thumb ? '' : FILE_ICON}</span>
      <span class="fmeta"><span class="fname">${esc(it.name)}</span>
        <span class="fstate ${it.state === 'done' ? 'ok' : it.state === 'err' ? 'err' : ''}">${it.state === 'done' ? '✓ ' : ''}${label(it)}</span>
        ${it.state === 'prep' || it.state === 'up' ? '<span class="fbar"><i></i></span>' : ''}</span>
      <button type="button" class="fdel" onclick="removeFile(${it.id})" aria-label="ลบไฟล์ ${esc(it.name)}" ${state.sending ? 'disabled' : ''}>${DEL_ICON}</button>
    </li>`).join('');
  updateSendBtn();
}
function updateSendBtn() {
  if (!state.task || state.task.type === 'quiz') return;
  const busy = state.files.filter(x => x.state !== 'done' && x.state !== 'err').length;
  $('sendBtn').textContent = state.sending ? (busy ? `รออัปโหลดอีก ${busy} ไฟล์…` : 'กำลังบันทึก…') : 'ส่งงาน';
}
function msg(t, isErr) { $('mMsg').textContent = t; $('mMsg').className = isErr ? 'err' : ''; }

// ย่อรูปก่อนอัปโหลด: ยาวสุด 1600 px คุณภาพ 0.82 (รูปจากมือถือ 4–8 MB เหลือราว 0.3–0.6 MB ยังอ่านลายมือชัด)
function prepare(file) {
  const orig = { blob: file, name: file.name, type: file.type || 'application/octet-stream', size: file.size };
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) || file.size < 450e3) return res(orig);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => {
        if (!b || b.size >= file.size) return res(orig);
        res({ blob: b, name: file.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', size: b.size });
      }, 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(orig); };
    img.src = url;
  });
}
function toBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function send() {
  if (state.task.type === 'quiz') return sendAnswers();
  if (!state.files.length) return msg('กรุณาเลือกไฟล์ก่อน', true);
  if (state.files.some(x => x.state === 'err')) return msg('มีไฟล์ที่อัปโหลดไม่สำเร็จ กด "ลองใหม่" หรือลบไฟล์นั้นก่อน', true);
  state.sending = true; state.busy = true; $('sendBtn').disabled = true; msg('');
  renderFiles(); maybeFinish();
}
async function maybeFinish() {
  if (!state.sending || state.finishing) return;
  if (state.files.some(x => x.state === 'err')) {
    state.sending = state.busy = false; $('sendBtn').disabled = false; renderFiles();
    return msg('มีไฟล์ที่อัปโหลดไม่สำเร็จ กด "ลองใหม่" หรือลบไฟล์นั้นก่อน', true);
  }
  if (state.files.some(x => x.state !== 'done')) return;     // ยังอัปโหลดไม่ครบ เดี๋ยวไฟล์สุดท้ายเรียกซ้ำเอง
  state.finishing = true; updateSendBtn();
  try {
    const r = await run('submitWork', state.room, state.student.no, state.task.id, state.files.map(x => x.result), state.pin);
    state.busy = false;
    closeUpload();
    toast(`ส่งงานเรียบร้อย (${r.status}) ${r.time}`);
    await loadTasks();
  } catch (e) {
    if (isAuth(e)) return authFail();
    msg('ส่งไม่สำเร็จ: ' + errText(e), true);
  } finally {
    state.sending = state.finishing = state.busy = false; $('sendBtn').disabled = false; updateSendBtn();
  }
}

async function sendAnswers() {
  const qs = state.task.questions;
  if (!qs.length) return msg('งานนี้ยังไม่มีคำถาม', true);
  const answers = qs.map((q, i) => {
    if (q.choices && q.choices.length) {
      const r = document.querySelector(`input[name="q${i}"]:checked`);
      return r ? r.value : '';
    }
    return $('ans' + i).value.trim();
  });
  const empty = answers.findIndex(a => !a);
  if (empty >= 0) {
    const el = $('ans' + empty);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (el.tagName === 'TEXTAREA') el.focus();
    return msg(`ยังไม่ได้ตอบข้อ ${empty + 1}`, true);
  }
  state.busy = true; $('sendBtn').disabled = true;
  try {
    msg('กำลังส่งคำตอบ…');
    const r = await run('submitAnswers', state.room, state.student.no, state.task.id, answers, state.pin);
    state.busy = false;
    closeUpload();
    toast(`ส่งคำตอบเรียบร้อย (${r.status}) ${r.time}`);
    await loadTasks();
  } catch (e) {
    if (isAuth(e)) return authFail();
    msg('ส่งไม่สำเร็จ: ' + errText(e), true);
  } finally {
    state.busy = false; $('sendBtn').disabled = false;
  }
}

init();
</script>
</body>
